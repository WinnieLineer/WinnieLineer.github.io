<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Warm peach background gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8cc"/>
      <stop offset="100%" stop-color="#f9d3b7"/>
    </radialGradient>
    <!-- Orange gold gradient for the W letterform -->
    <linearGradient id="wgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1f10"/>
      <stop offset="50%" stop-color="#e07a3a"/>
      <stop offset="100%" stop-color="#ffb51b"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14"
        fill="none" stroke="rgba(211,119,53,0.35)" stroke-width="1.5"/>

  <!-- W letterform — bold, gradient fill -->
  <text
    x="32" y="46"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="40"
    font-weight="900"
    fill="url(#wgrad)"
    filter="url(#glow)"
    letter-spacing="-2"
  >W</text>

  <!-- Particle dots scattered around -->
  <circle cx="10" cy="10" r="2"   fill="#e07a3a" opacity="0.65"/>
  <circle cx="54" cy="9"  r="1.5" fill="#ffb51b" opacity="0.55"/>
  <circle cx="56" cy="54" r="1.8" fill="#d35346" opacity="0.50"/>
  <circle cx="9"  cy="55" r="1.5" fill="#e07a3a" opacity="0.45"/>
  <circle cx="32" cy="7"  r="1.2" fill="#ffb51b" opacity="0.40"/>
  <circle cx="58" cy="30" r="1"   fill="#e07a3a" opacity="0.35"/>
  <circle cx="6"  cy="32" r="1"   fill="#ffb51b" opacity="0.35"/>
</svg>